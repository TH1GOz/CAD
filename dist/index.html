<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#300304">
  <meta name="description" content="Convite de 15 anos da Driellen. Confirme sua presença pelo WhatsApp.">
  <title>15 Anos da Driellen — Confirme sua presença</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100svh; min-height: 100dvh;
      display: grid; place-items: center; overflow: hidden;
      background: #300304;
      font-family: Arial, Helvetica, sans-serif;
      position: relative;
      isolation: isolate;
    }
    /* Em telas largas, o próprio convite cria um fundo discreto que preenche a tela. */
    body::before {
      content: "";
      position: fixed; inset: -18px;
      background: url("/convite.png") center / cover no-repeat;
      filter: blur(16px) brightness(.38);
      transform: scale(1.04);
      z-index: 0;
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed; inset: 0;
      background: rgba(48, 3, 4, .42);
      z-index: 0;
      pointer-events: none;
    }
    .invite {
      position: relative;
      height: min(100dvh, calc(100vw * 1536 / 1021));
      width: min(100vw, calc(100dvh * 1021 / 1536));
      max-width: 100vw;
      aspect-ratio: 1021 / 1536;
      overflow: hidden;
      background: #300304;
      box-shadow: 0 0 50px rgba(0,0,0,.28);
      z-index: 1;
      flex: none;
    }
    .invite img {
      display: block; width: 100%; height: 100%;
      object-fit: contain;
    }
    .rsvp {
      position: absolute;
      /* Área clicável cobre o texto e o selo de confirmação do convite */
      right: 2.5%; bottom: 3.1%;
      width: 39%; height: 8.8%;
      display: block; border-radius: 12px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      outline-offset: 4px;
    }
    .rsvp:focus-visible { outline: 3px solid #fff; }
    .rsvp:hover { background: rgba(255,255,255,.06); }
    .hint {
      position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: rgba(255,255,255,.78); font-size: 12px;
      background: rgba(30,0,0,.72); border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px; padding: 7px 12px; white-space: nowrap;
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    @media (hover: none) { .hint { display: none; } }
    @media (min-width: 700px) {
      body { padding: 0; }
      .invite {
        height: 100dvh;
        width: min(100vw, calc(100dvh * 1021 / 1536));
        max-width: 100vw;
        box-shadow: 0 0 64px rgba(0,0,0,.48);
      }
    }
    @media (max-width: 699px) {
      body::before { filter: blur(12px) brightness(.42); }
      body::after { background: rgba(48, 3, 4, .24); }
    }
  </style>
</head>
<body>
  <main class="invite" aria-label="Convite de 15 anos da Driellen">
    <img src="/convite.png" alt="Convite de 15 anos da Driellen, sábado, 28 de novembro.">
    <a class="rsvp"
       href="https://wa.me/5514991440905?text=Eu%20confirmo%20a%20minha%20presen%C3%A7a%20para%20o%20seu%20anivers%C3%A1rio%21%21%21"
       target="_blank" rel="noopener noreferrer"
       aria-label="Confirmar presença pelo WhatsApp"
       title="Confirmar presença pelo WhatsApp"></a>
  </main>
  <div class="hint">Toque em “Confirme sua presença aqui” para abrir o WhatsApp</div>
</body>
</html>
